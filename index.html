:root{--cream:#f5ede0;--ink:#2c2620;--gold:#c9a86a;--gold-deep:#a8894f;--sheet:#f7f1e6;
  --dim:#8e9bb5;--dimmer:#5f6b86;--line:#2a3a5e;
  --ui:'Jost',system-ui,sans-serif;--deco:'Ajoure Decorative','EB Garamond',cursive;
  --night:radial-gradient(ellipse at top,#1a2547 0%,#0e1730 55%,#060c1e 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060c1e;color:var(--cream);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.screen{min-height:100vh;background:var(--night)}
.fade{animation:fu .45s ease both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Gate */
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:3rem 1.2rem;text-align:center;background:var(--night)}
.gate-mark{width:84px;opacity:.9;margin-bottom:1.8rem}
.gate-k{font-family:Georgia,serif;font-style:italic;font-size:.72rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--gold-deep)}
.gate-t{font-family:var(--deco);color:var(--cream);font-size:clamp(1.9rem,7vw,2.8rem);
  line-height:1.1;margin:.9rem 0 0}
.gate-t span{display:block}
.gate-t .the{font-size:.44em;letter-spacing:.14em;margin-bottom:.16em}
.gate-t .chr{font-size:.64em;letter-spacing:.06em;margin-top:.1em}
.gate-rule{width:52px;height:1px;background:var(--gold);margin:1.5rem auto}
.gate-note{font-family:Georgia,serif;font-style:italic;color:var(--dim);font-size:.94rem;max-width:26rem}
.gate-form{display:flex;gap:.6rem;margin-top:2rem;width:min(400px,92vw)}
.gate-form input{flex:1;min-width:0;background:rgba(10,16,34,.9);border:1px solid #3a4a72;
  border-radius:10px;color:var(--cream);font-family:var(--ui);font-size:1rem;padding:.8rem 1rem}
.gate-form input::placeholder{color:#55618a}
.gate-form input:focus{outline:none;border-color:var(--gold)}
.gate-form button{background:var(--gold);border:0;border-radius:10px;color:#1a1408;
  font-family:var(--ui);font-size:.9rem;font-weight:500;padding:.8rem 1.3rem;cursor:pointer;white-space:nowrap}
.gate-form button[disabled]{opacity:.5;cursor:default}
.gate-err{margin-top:1rem;font-family:var(--ui);font-size:.82rem;color:#E8935F;min-height:1.2em}
.gate-foot{margin-top:2.6rem;font-family:var(--ui);font-size:.7rem;letter-spacing:.1em;color:var(--dimmer)}
.loading{min-height:100vh;display:grid;place-items:center;background:var(--night);
  font-family:var(--ui);font-size:.82rem;color:var(--dimmer)}

/* Home */
.home{max-width:720px;margin:0 auto;padding:5rem 1.2rem}
.home-mark{display:block;width:96px;margin:0 auto 2rem;opacity:.9}
.home-eyebrow{text-align:center;font-family:Georgia,serif;font-style:italic;font-size:.72rem;
  letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep)}
.home-title{text-align:center;font-family:var(--deco);font-weight:400;color:var(--cream);
  font-size:clamp(2.4rem,10vw,4rem);line-height:1.05;margin:.9rem 0 0}
.home-title span{display:block;line-height:1.1}
.home-title .the{font-size:.42em;letter-spacing:.14em;margin-bottom:.18em}
.home-title .chr{font-size:.62em;letter-spacing:.06em;margin-top:.1em}
.home-rule{width:60px;height:1px;background:var(--gold);margin:1.6rem auto}
.resume{display:flex;align-items:center;gap:1rem;width:100%;margin:1rem 0 0;padding:1rem 1.2rem;
  background:rgba(201,168,106,.1);border:1px solid rgba(201,168,106,.4);border-radius:12px;cursor:pointer;text-align:left;color:inherit}
.resume:hover{background:rgba(201,168,106,.16)}
.resume-l{flex:1;min-width:0}
.resume-k{display:block;font-family:var(--ui);font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep)}
.resume-t{display:block;font-family:Georgia,serif;font-style:italic;font-size:1rem;color:#e8e2d4;margin-top:.2rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-go{font-family:var(--ui);font-size:.76rem;color:var(--gold);white-space:nowrap}
.parts{margin-top:1.6rem;display:flex;flex-direction:column;gap:1rem}
.part{position:relative;overflow:hidden;display:flex;align-items:center;gap:1.3rem;width:100%;padding:1.5rem;
  border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left;color:inherit;
  transition:border-color .2s,transform .2s;background:rgba(24,34,65,.5)}
.part::before{content:'';position:absolute;inset:0;opacity:.5;transition:opacity .25s;
  background:linear-gradient(100deg,var(--el-a) 0%,var(--el-b) 42%,rgba(24,34,65,0) 78%)}
.part::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--el-edge)}
.part>*{position:relative;z-index:1}
.part:hover{border-color:var(--el-edge);transform:translateY(-1px)}
.part:hover::before{opacity:.78}
.part[disabled]{opacity:.4;cursor:default}
.part[disabled]:hover{border-color:var(--line);transform:none}
.el-fire{--el-a:rgba(176,63,30,.5);--el-b:rgba(120,52,38,.22);--el-edge:#C4552E}
.el-water{--el-a:rgba(28,104,132,.5);--el-b:rgba(28,78,116,.22);--el-edge:#2E8CA8}
.el-metal{--el-a:rgba(126,138,158,.42);--el-b:rgba(88,100,124,.2);--el-edge:#9AA6BC}
.el-fire .part-el{color:#F0A878}.el-water .part-el{color:#8AD2E6}.el-metal .part-el{color:#C7D1E2}
.part-n{font-family:var(--deco);font-size:2.5rem;line-height:1;min-width:2.6rem;text-align:center;color:var(--cream)}
.part-b{flex:1;min-width:0}
.part-t{display:block;font-family:Georgia,serif;font-size:1.34rem;color:#e8e2d4}
.part-el{font-style:italic}
.part-m{display:block;font-family:var(--ui);font-size:.84rem;color:var(--dimmer);margin-top:.5rem}
.part-go{font-family:var(--ui);font-size:1.1rem;color:var(--dimmer)}
.home-note{margin-top:2.6rem;text-align:center;font-family:var(--ui);font-size:.72rem;letter-spacing:.1em;color:var(--dimmer)}
@media(max-width:560px){.home{padding:3rem 1rem 4rem}.part{padding:1.2rem 1.1rem;gap:.9rem}.part-n{font-size:2rem;min-width:2rem}}

/* Contents */
.toc{max-width:680px;margin:0 auto;padding:1.4rem 0 5rem}
.toc-head{text-align:center;margin:1.6rem 0 2.4rem}
.toc-k{font-family:var(--ui);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep)}
.el-fire .toc-k{color:#E8935F}.el-water .toc-k{color:#6FC2D8}
.toc-t{font-family:var(--deco);font-size:clamp(2rem,8vw,3rem);margin:.7rem 0 0;line-height:1.1;color:var(--cream)}
.toc-m{font-family:var(--ui);font-size:.86rem;color:var(--dimmer);margin-top:.9rem;letter-spacing:.08em}
.row{display:flex;align-items:baseline;gap:1.1rem;width:100%;padding:1.05rem .7rem;background:none;border:0;
  border-bottom:.5px solid rgba(58,74,114,.4);cursor:pointer;text-align:left;color:inherit}
.row:hover{background:rgba(24,34,65,.55)}
.row.here{background:rgba(201,168,106,.09)}
.row-n{font-family:var(--ui);font-size:.9rem;color:var(--dimmer);min-width:2.2rem;font-variant-numeric:tabular-nums}
.row-b{flex:1;min-width:0}
.row-t{display:block;font-family:Georgia,serif;font-size:1.16rem;color:#e8e2d4;line-height:1.35}
.row-n2{display:block;font-family:Georgia,serif;font-style:italic;font-size:.92rem;color:var(--dim);margin-top:.25rem}
.row-d{font-family:var(--ui);font-size:.76rem;color:var(--gold-deep);white-space:nowrap}

/* Reader */
.reader{min-height:100vh;background:var(--night);padding:0 1rem 6rem}
.bar{position:sticky;top:0;z-index:60;max-width:680px;margin:0 auto;display:flex;align-items:center;gap:.7rem;padding:.75rem .2rem}
.btn{background:rgba(24,34,65,.9);backdrop-filter:blur(6px);border:.5px solid #3a4a72;color:#e8e2d4;
  font-family:var(--ui);font-size:.8rem;padding:.5rem .85rem;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(34,48,90,.95)}
.btn .lbl{display:inline}
@media(max-width:520px){.btn .lbl{display:none}.bar{gap:.45rem}}
.bar-now{flex:1;min-width:0;font-family:Georgia,serif;font-style:italic;font-size:.82rem;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.sheet{background:var(--sheet);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);
  padding:3rem 2.6rem;max-width:680px;margin:.4rem auto 0}
.ch-head{text-align:center;margin-bottom:2.4rem}
.ch-k{font-family:Georgia,serif;font-style:italic;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep)}
.ch-t{font-family:var(--deco);font-weight:400;font-size:2rem;color:var(--ink);margin:.6rem 0 0;line-height:1.2}
.ch-r{width:46px;height:1px;background:var(--gold);margin:1.2rem auto 0}
.ch-by{font-family:Georgia,serif;font-style:italic;font-size:.85rem;color:#8a6d3b;margin-top:1rem}
.prose{font-family:Georgia,serif;color:var(--ink);line-height:1.72;text-align:justify;
  hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;font-size:19px}
.prose p{margin:0;text-indent:1.6em}
.prose p.first{text-indent:0}
.prose p.ital{font-style:italic}
/* A prose piece that isn't the first in the chronicle gets its own small heading. */
.sub-piece{margin:2.6em 0 1.4em;text-align:center}
.sub-piece span{font-family:Georgia,serif;font-style:italic;font-size:.78rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold-deep)}
.brk{text-align:center;margin:1.8em 0}
.brk img{width:64px;opacity:.9}
.thread{max-width:680px;margin:0 auto;text-align:center;padding:2.4rem 0 1.4rem}
.thread img{width:58px;opacity:.45}
.thread div{font-family:var(--ui);font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--dimmer);margin-top:.9rem}
@media(max-width:560px){.sheet{padding:2rem 1.4rem}.ch-t{font-size:1.6rem}}

/* A WebP piece, sitting at its sort-order position in the chronicle. */
.doc-chip{display:flex;align-items:center;gap:.9rem;width:100%;margin:2em 0;padding:.9rem 1.05rem;
  background:rgba(44,38,32,.045);border:.5px solid #d8c39a;border-radius:12px;cursor:pointer;
  text-align:left;font-family:Georgia,serif;transition:background .16s,border-color .16s}
.doc-chip:hover{background:rgba(201,168,106,.17);border-color:var(--gold)}
.chip-th{position:relative;width:40px;height:48px;flex:none}
.chip-th i{position:absolute;inset:0;border:1px solid #cbb392;border-radius:3px;background:#fdfaf3}
.chip-th i:nth-child(1){transform:rotate(-5deg) translate(-2px,1px);opacity:.5}
.chip-th i:nth-child(2){transform:rotate(3deg) translate(1px,-1px);opacity:.78}
.chip-th i:nth-child(3){background:linear-gradient(160deg,#fffdf7,#f2e9d6)}
.chip-th b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--ui);font-size:.6rem;font-weight:500;color:#a08a63}
.chip-b{flex:1;min-width:0}
.chip-k{display:block;font-family:var(--ui);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep)}
.chip-t{display:block;font-size:1rem;font-style:italic;color:var(--ink);margin-top:.12rem}
.chip-go{font-family:var(--ui);font-size:.7rem;color:#a08a63;white-space:nowrap}

/* Document viewer */
.doc{position:fixed;inset:0;z-index:150;background:rgba(3,6,16,.93);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s}
.doc.open{opacity:1;pointer-events:auto}
.doc-bar{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;flex:none}
.doc-ttl{flex:1;min-width:0}
.doc-k{display:block;font-family:var(--ui);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep)}
.doc-n{display:block;font-family:Georgia,serif;font-style:italic;font-size:1rem;color:#e8e2d4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-x{background:rgba(24,34,65,.9);border:.5px solid #3a4a72;color:#e8e2d4;width:38px;height:38px;
  border-radius:10px;cursor:pointer;font-size:1rem;flex:none}
.doc-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 1rem;position:relative}
.doc-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  background:rgba(12,20,40,.9);border:1px solid #3a4a72;color:#e8e2d4;cursor:pointer;font-size:1.1rem;z-index:2}
.doc-nav[disabled]{opacity:.22;cursor:default}
.doc-prev{left:.4rem}.doc-next{right:.4rem}
.doc-page{max-height:100%;max-width:min(640px,100%);display:flex;align-items:center;justify-content:center}
.doc-page img{max-width:100%;max-height:78vh;width:auto;height:auto;border-radius:3px;
  box-shadow:0 18px 60px rgba(0,0,0,.65);display:block;background:#fdfaf3;min-width:220px;min-height:160px}
.doc-page img:not([data-ok]){animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.6}}
/* Placeholder until the WebP scans are dropped in. */
.pg-ph{width:min(520px,86vw);aspect-ratio:17/22;background:#fdfaf3;border:1px solid #e6dcc6;border-radius:3px;
  box-shadow:0 18px 60px rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.9rem;padding:2rem;text-align:center}
.pg-ph .k{font-family:var(--ui);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:#bda97f}
.pg-ph .t{font-family:var(--deco);font-size:1.5rem;color:#2c2620;line-height:1.25}
.pg-ph .f{font-family:var(--ui);font-size:.68rem;color:#a08a63;line-height:1.7;
  border-top:1px dashed #e0d3b8;padding-top:.9rem;margin-top:.4rem;width:100%;word-break:break-all}
.doc-foot{flex:none;display:flex;align-items:center;justify-content:center;gap:1rem;padding:.9rem 1rem 1.3rem;flex-wrap:wrap}
.doc-dots{display:flex;gap:6px}
.doc-dots i{width:7px;height:7px;border-radius:50%;background:#3a4a72;cursor:pointer}
.doc-dots i.on{background:var(--gold)}
.doc-count{font-family:var(--ui);font-size:.74rem;color:var(--dimmer);font-variant-numeric:tabular-nums}
.doc-back{font-family:var(--ui);font-size:.74rem;color:var(--gold);background:none;border:0;cursor:pointer}
@media(max-width:560px){.doc-stage{padding:0 .3rem}.doc-nav{width:36px;height:36px}}

/* Drawer */
.drawer{position:fixed;inset:0;z-index:120;background:rgba(4,8,20,.72);opacity:0;pointer-events:none;transition:opacity .22s}
.drawer.open{opacity:1;pointer-events:auto}
.drawer-p{position:absolute;left:0;top:0;bottom:0;width:min(420px,90vw);background:#0b1224;border-right:1px solid #223054;
  padding:1.6rem 1.1rem;overflow:auto;transform:translateX(-100%);transition:transform .26s ease}
.drawer.open .drawer-p{transform:none}
.drawer h3{font-family:var(--deco);font-size:1.5rem;font-weight:400;margin-bottom:.3rem;color:var(--cream)}
.drawer .sub{font-family:var(--ui);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer);margin-bottom:1.2rem}
.drawer-home{margin-bottom:1.2rem}
.drawer-size{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin:0 0 1.2rem;
  padding:.7rem .3rem 1.1rem;border-bottom:.5px solid rgba(58,74,114,.4)}
.drawer-size::before{content:'Text size';font-family:var(--ui);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer)}
.sizebar{display:flex;gap:6px;align-items:center}
.sizebar button{width:38px;height:38px;border-radius:10px;background:rgba(24,34,65,.9);border:.5px solid #3a4a72;
  color:#e8e2d4;font-family:Georgia,serif;font-size:.95rem;cursor:pointer}
.sizebar button[disabled]{opacity:.35;cursor:default}
.sizebar .sz{font-family:var(--ui);font-size:.7rem;color:var(--dimmer);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
</style>
</head>

var TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy'];

 'Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
function numword(n){
  if(n<20)return ONES[n];
  var t=TENS[Math.floor(n/10)], o=ONES[n%10];
  return o?t+'-'+o:t;
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(t){t=String(t||'');if(t.indexOf('*')===-1)return esc(t);
  return t.split(/\*([^*]+)\*/g).map(function(s,i){return i%2?'<em>'+esc(s)+'</em>':esc(s.replace(/\*/g,''))}).join('')}
function chron(n){for(var i=0;i<PARTS.length;i++){var cs=PARTS[i].chronicles;
  for(var j=0;j<cs.length;j++)if(cs[j].n===n)return cs[j]}return null}
function partOf(n){for(var i=0;i<PARTS.length;i++){var cs=PARTS[i].chronicles;
  for(var j=0;j<cs.length;j++)if(cs[j].n===n)return PARTS[i]}return null}

var size=(function(){var v=parseInt(got(SIZE_KEY),10);return v>=MIN&&v<=MAX?v:DEF})();

}
function sizeBar(){return '<div class="sizebar"><button id="sz-" aria-label="Smaller text">A\u2212</button>'+
  '<span class="sz" id="sz"></span><button id="sz+" aria-label="Larger text">A+</button></div>'}
function wireSize(){
  var a=document.getElementById('sz-'),b=document.getElementById('sz+');
  if(a)a.onclick=function(){size=Math.max(MIN,size-1);put(SIZE_KEY,String(size));applySize()};
  if(b)b.onclick=function(){size=Math.min(MAX,size+1);put(SIZE_KEY,String(size));applySize()};
  applySize();
}
var tick=0;
function savePos(n,y){var t=Date.now();if(t-tick<700)return;tick=t;put(POS_KEY,JSON.stringify({n:n,y:Math.round(y)}))}
function readPos(){try{return JSON.parse(got(POS_KEY)||'null')}catch(e){return null}}

/* Routing */
function route(){var h=location.hash||'',m;
  if((m=h.match(/^#\/part\/(\d+)$/)))return{v:'toc',p:+m[1]};
  if((m=h.match(/^#\/read\/(\d+)$/)))return{v:'read',n:+m[1]};
  return{v:'home'}}
function go(h){location.hash=h}
var teardown=[];
function onScroll(fn){window.addEventListener('scroll',fn,{passive:true});
  teardown.push(function(){window.removeEventListener('scroll',fn)})}
function reset(){teardown.forEach(function(f){f()});teardown=[]}

/* Chronicle rendering — pieces in sort order */
function proseHTML(blocks){
  var out='',first=true;
  blocks.forEach(function(b){
    if(b.t==='p'){var cl=[];if(first)cl.push('first');if(b.i)cl.push('ital');first=false;
      out+='<p'+(cl.length?' class="'+cl.join(' ')+'"':'')+'>'+inline(b.x)+'</p>'}
    else if(b.t==='brk'){first=true;out+='<div class="brk"><img src="'+AVEN+'" alt=""></div>'}
    else if(b.t==='img'){first=true;
      out+='<figure style="margin:1.8em 0;text-align:center"><img src="'+esc(String(b.src||'').replace(/^\//,''))+
        '" style="max-width:min(380px,92%)" alt="'+esc(b.alt||'')+'" loading="lazy"></figure>'}
  });
  return out;
}
function chipHTML(c,i,p){
  return '<button class="doc-chip" data-doc="'+c.n+':'+i+'">'+
    '<span class="chip-th"><i></i><i></i><i></i><b>'+p.pages+'</b></span>'+
    '<span class="chip-b"><span class="chip-k">Enclosure</span>'+
    '<span class="chip-t">'+esc(p.title)+'</span></span>'+
    '<span class="chip-go">Open \u2192</span></button>';
}
function chronHTML(c){
  var full=PROSE[c.n];
  if(!full)return '<section class="sheet"><div class="prose" style="text-align:center;color:#a08a63;'+
    'font-family:\'Jost\',sans-serif;font-size:.84rem;padding:2rem 0">Loading chronicle '+c.n+'\u2026</div></section>';
  c=full;
  var body='', proseSeen=0;
  c.pieces.forEach(function(p,i){
    if(p.kind==='webp'){body+=chipHTML(c,i,p);return}
    if(!p.blocks||!p.blocks.length)return;
    proseSeen++;
    if(proseSeen>1)body+='<div class="sub-piece"><span>'+esc(p.title)+'</span></div>';
    body+=proseHTML(p.blocks);
  });
  return '<section class="sheet"><div class="ch-head">'+
    '<div class="ch-k">Chronicle '+esc(numword(c.n)||c.n)+'</div>'+
    '<h2 class="ch-t">'+esc(c.letterTitle||c.pieces[0].title)+'</h2><div class="ch-r"></div>'+
    (c.narrator?'<div class="ch-by">'+esc(c.narrator)+'</div>':'')+'</div>'+
    '<div class="prose">'+body+'</div></section>';
}

/* Document viewer */
var doc={p:null,at:0};
function docHTML(){
  return '<div class="doc" id="doc"><div class="doc-bar">'+
    '<span class="doc-ttl"><span class="doc-k">Enclosure</span><span class="doc-n" id="dn"></span></span>'+
    '<button class="doc-x" id="dx" aria-label="Close">\u2715</button></div>'+
    '<div class="doc-stage">'+
      '<button class="doc-nav doc-prev" id="dp" aria-label="Previous page">\u2039</button>'+
      '<div class="doc-page" id="dpage"></div>'+
      '<button class="doc-nav doc-next" id="dnx" aria-label="Next page">\u203a</button></div>'+
    '<div class="doc-foot"><span class="doc-dots" id="dd"></span>'+
      '<span class="doc-count" id="dc"></span>'+
      '<button class="doc-back" id="db">Close and keep reading</button></div></div>';
}
function paintDoc(){
  var p=doc.p;if(!p)return;
  var side=doc.at%2===0?'front':'back', leaf=Math.floor(doc.at/2)+1;
  var stage=document.getElementById('dpage');
  if(p.id){
    // /api/page signs a short-lived Supabase URL server-side and redirects here.
    stage.innerHTML='<img alt="'+esc(p.title)+' \u2014 page '+leaf+' '+side+'" '+
      'src="/api/page?f='+encodeURIComponent(p.id)+'&p='+(doc.at+1)+'">';
    var im=stage.querySelector('img');
    im.onload=function(){im.setAttribute('data-ok','1')};
    im.onerror=function(){
      stage.innerHTML='<div class="pg-ph"><div class="k">Enclosure unavailable</div>'+
        '<div class="t">'+esc(p.title)+'</div>'+
        '<div class="f">page '+leaf+' \u00b7 '+side+'<br>Could not load this scan</div></div>';};
    // Warm the next page so paging forward feels instant.
    if(doc.at+1<p.pages){var n=new Image();n.src='/api/page?f='+encodeURIComponent(p.id)+'&p='+(doc.at+2)}
  } else {
    stage.innerHTML='<div class="pg-ph"><div class="k">Scanned enclosure</div>'+
      '<div class="t">'+esc(p.title)+'</div>'+
      '<div class="f">page '+leaf+' \u00b7 '+side+'</div></div>';
  }
  document.getElementById('dc').textContent=(doc.at+1)+' / '+p.pages;
  document.getElementById('dp').disabled=doc.at===0;
  document.getElementById('dnx').disabled=doc.at>=p.pages-1;
  var dots='';for(var i=0;i<p.pages;i++)dots+='<i class="'+(i===doc.at?'on':'')+'" data-pg="'+i+'"></i>';
  document.getElementById('dd').innerHTML=dots;
}
function openDoc(p){doc.p=p;doc.at=0;
  document.getElementById('dn').textContent=p.title;
  paintDoc();document.getElementById('doc').classList.add('open')}
function closeDoc(){var d=document.getElementById('doc');if(d)d.classList.remove('open')}
function step(n){if(!doc.p)return;doc.at=Math.min(doc.p.pages-1,Math.max(0,doc.at+n));paintDoc()}
function wireDoc(root){
  root.addEventListener('click',function(e){
    var chip=e.target.closest('[data-doc]');
    if(chip){var q=chip.getAttribute('data-doc').split(':');var c=chron(+q[0]);
      if(c)openDoc(c.pieces[+q[1]]);return}
    var dot=e.target.closest('[data-pg]');
    if(dot){doc.at=+dot.getAttribute('data-pg');paintDoc();return}
    var id=e.target.id;
    if(id==='dx'||id==='db')closeDoc();
    else if(id==='dp')step(-1);
    else if(id==='dnx')step(1);
  });
  var key=function(e){var d=document.getElementById('doc');
    if(!d||!d.classList.contains('open'))return;
    if(e.key==='Escape')closeDoc();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)};
  document.addEventListener('keydown',key);
  teardown.push(function(){document.removeEventListener('keydown',key)});
  var x0=null;
  root.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  root.addEventListener('touchend',function(e){
    var d=document.getElementById('doc');
    if(x0===null||!d||!d.classList.contains('open'))return;
    var dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)>55)step(dx<0?1:-1)},{passive:true});
}

/* Views */
function viewHome(){
  var pos=readPos(),h='<div class="screen fade"><div class="home">'+
    '<img class="home-mark" src="'+AVEN+'" alt="">'+
    '<div class="home-eyebrow">The Flower Letters</div>'+
    '<h1 class="home-title"><span class="the">The</span>Norah Aven<span class="chr">Chronicles</span></h1>'+
    '<div class="home-rule"></div>';
  if(pos&&chron(pos.n)){var c=chron(pos.n);
    h+='<button class="resume" id="resume"><span class="resume-l"><span class="resume-k">Continue reading</span>'+
      '<span class="resume-t">Chronicle '+c.n+' \u00b7 '+esc(c.letterTitle)+'</span></span>'+
      '<span class="resume-go">Resume \u2192</span></button>'}
  h+='<div class="parts">';
  PARTS.forEach(function(p){
    var lo=p.part===1?1:p.part===2?25:49, hi=lo+23;
    var docs=p.chronicles.reduce(function(s,c){return s+docsIn(c).length},0);
    h+='<button class="part el-'+p.element.toLowerCase()+'"'+(p.pending?' disabled':' data-p="'+p.part+'"')+'>'+
      '<span class="part-n">'+p.part+'</span><span class="part-b">'+
      '<span class="part-t">Part '+p.part+': <span class="part-el">'+esc(p.element)+'</span></span>'+
      '<span class="part-m">Chronicles '+lo+'\u2013'+hi+
        (p.pending?' \u00b7 not yet loaded':' \u00b7 '+docs+' enclosures')+'</span></span>'+
      '<span class="part-go">'+(p.pending?'':'\u2192')+'</span></button>';
  });
  h+='</div><div class="home-note">Private manuscript \u00b7 not for distribution</div></div></div>';
  app.innerHTML=h;
  var r=document.getElementById('resume');
  if(r)r.onclick=function(){go('#/read/'+pos.n)};
  Array.prototype.forEach.call(app.querySelectorAll('.part[data-p]'),function(b){
    b.onclick=function(){go('#/part/'+b.getAttribute('data-p'))}});
}

function viewToc(pn){
  var p=PARTS.filter(function(x){return x.part===pn})[0];
  if(!p||!p.chronicles.length){go('#');return}
  var pos=readPos();
  var h='<div class="screen fade el-'+p.element.toLowerCase()+'"><div class="reader"><div class="bar">'+
    '<button class="btn" id="home">\u2190 All parts</button><div class="bar-now"></div></div>'+
    '<div class="toc"><div class="toc-head"><div class="toc-k">Part '+p.part+'</div>'+
    '<h1 class="toc-t">'+esc(p.element)+'</h1><div class="toc-m">'+p.chronicles.length+' chronicles</div></div>';
  p.chronicles.forEach(function(c){
    var d=docsIn(c).length;
    h+='<button class="row'+(pos&&pos.n===c.n?' here':'')+'" data-n="'+c.n+'">'+
      '<span class="row-n">'+c.n+'</span><span class="row-b">'+
      '<span class="row-t">'+esc(c.letterTitle)+'</span>'+
      '<span class="row-n2">'+esc(c.narrator)+'</span></span>'+
      (d?'<span class="row-d">'+d+' encl.</span>':'')+'</button>';
  });
  app.innerHTML=h+'</div></div></div>';
  document.getElementById('home').onclick=function(){go('#')};
  Array.prototype.forEach.call(app.querySelectorAll('.row'),function(b){
    b.onclick=function(){go('#/read/'+b.getAttribute('data-n'))}});
}

function viewRead(startN){
  var p=partOf(startN);if(!p){go('#');return}
  app.innerHTML='<div class="reader el-'+p.element.toLowerCase()+'"><div class="bar">'+
    '<button class="btn" id="back" aria-label="Back to Part '+p.part+'">\u2190 <span class="lbl">Part '+p.part+'</span></button>'+
    '<div class="bar-now" id="now"></div>'+
    '<button class="btn" id="menu" aria-label="Chronicles">\u2630</button></div>'+
    '<div id="flow"></div>'+
    '<div class="drawer" id="drawer"><div class="drawer-p">'+
    '<button class="btn drawer-home" id="dhome">\u2190 All parts</button>'+
    '<h3>Part '+p.part+': '+esc(p.element)+'</h3><div class="sub">'+p.chronicles.length+' chronicles</div>'+
    '<div class="drawer-size">'+sizeBar()+'</div><div id="list"></div></div></div>'+docHTML()+'</div>';
  var root=app.querySelector('.reader'), flow=document.getElementById('flow');
  var loaded=[],at=0;
  function idxOf(n){for(var i=0;i<p.chronicles.length;i++)if(p.chronicles[i].n===n)return i;return 0}
  function add(i){
    if(i<0||i>=p.chronicles.length||loaded.indexOf(i)!==-1)return;
    loaded.push(i);var c=p.chronicles[i];
    var d=document.createElement('div');d.id='ch-'+c.n;
    var lead=loaded.length>1?'<div class="thread"><img src="'+AVEN+'" alt=""><div>Chronicle '+c.n+'</div></div>':'';
    d.innerHTML=lead+chronHTML(c);
    flow.appendChild(d);applySize();
    if(!PROSE[c.n]){
      fetchChronicle(c.n).then(function(){
        var el=document.getElementById('ch-'+c.n);
        if(el){el.innerHTML=lead+chronHTML(c);applySize()}
      });
    }
  }
  function label(){var c=p.chronicles[at];
    document.getElementById('now').textContent='Chronicle '+c.n+' \u00b7 '+c.letterTitle;
    Array.prototype.forEach.call(root.querySelectorAll('#list .row'),function(b){
      b.classList.toggle('here',+b.getAttribute('data-i')===at)})}
  function start(i){flow.innerHTML='';loaded=[];add(i);add(i+1);at=i;label()}
  document.getElementById('list').innerHTML=p.chronicles.map(function(c,i){
    var d=docsIn(c).length;
    return '<button class="row" data-i="'+i+'"><span class="row-n">'+c.n+'</span><span class="row-b">'+
      '<span class="row-t">'+esc(c.letterTitle)+'</span><span class="row-n2">'+esc(c.narrator)+'</span></span>'+
      (d?'<span class="row-d">'+d+'</span>':'')+'</button>'}).join('');
  var drawer=document.getElementById('drawer');
  document.getElementById('menu').onclick=function(){drawer.classList.add('open')};
  drawer.onclick=function(e){if(e.target===drawer)drawer.classList.remove('open')};
  document.getElementById('back').onclick=function(){go('#/part/'+p.part)};
  document.getElementById('dhome').onclick=function(){go('#')};
  Array.prototype.forEach.call(root.querySelectorAll('#list .row'),function(b){
    b.onclick=function(){drawer.classList.remove('open');start(+b.getAttribute('data-i'));window.scrollTo(0,0)}});

  start(idxOf(startN));
  var pos=readPos();
  if(pos&&pos.n===startN&&pos.y){var host=document.getElementById('ch-'+startN);
    if(host)window.scrollTo(0,Math.max(0,host.offsetTop+pos.y))}
  else window.scrollTo(0,0);

  onScroll(function(){
    if(window.scrollY+window.innerHeight>document.documentElement.scrollHeight-1600)
      add(loaded[loaded.length-1]+1);
    var cur=at;
    loaded.forEach(function(i){var el=document.getElementById('ch-'+p.chronicles[i].n);
      if(el&&el.getBoundingClientRect().top<140)cur=i});
    if(cur!==at){at=cur;label()}
    var el2=document.getElementById('ch-'+p.chronicles[at].n);
    if(el2)savePos(p.chronicles[at].n,window.scrollY-el2.offsetTop);
    if(location.hash!=='#/read/'+p.chronicles[at].n)
      history.replaceState(null,'','#/read/'+p.chronicles[at].n);
  });
  wireDoc(root);wireSize();
}

var shownN=null;
function render(){
  var r=route();
  if(r.v==='read'&&shownN!==null&&document.getElementById('ch-'+r.n))return;
  shownN=(r.v==='read')?r.n:null;reset();
  if(r.v==='toc')viewToc(r.p);
  else if(r.v==='read')viewRead(r.n);
  else viewHome();
}

// Chronicle prose is fetched on demand and kept for the session.
var inflight={};
function fetchChronicle(n){
  if(PROSE[n])return Promise.resolve(PROSE[n]);
  if(inflight[n])return inflight[n];
  inflight[n]=fetch('/api/chronicle?n='+n,{credentials:'same-origin'})
    .then(function(r){
      if(r.status===401){viewGate('Your session expired. Enter the password again.');return null}
      if(!r.ok)throw new Error('chronicle '+r.status);
      return r.json();
    })
    .then(function(d){if(d)PROSE[n]=d;delete inflight[n];return d})
    .catch(function(e){delete inflight[n];throw e});
  return inflight[n];
}

/* ── Gate ────────────────────────────────────────────────────────────────── */
function viewGate(msg){
  app.innerHTML='<div class="gate fade">'+
    '<img class="gate-mark" src="'+AVEN+'" alt="">'+
    '<div class="gate-k">The Flower Letters</div>'+
    '<h1 class="gate-t"><span class="the">The</span>Norah Aven<span class="chr">Chronicles</span></h1>'+
    '<div class="gate-rule"></div>'+
    '<p class="gate-note">This manuscript is private. Enter the password you were given.</p>'+
    '<form class="gate-form" id="gf" autocomplete="on">'+
      '<input id="pw" type="password" name="password" placeholder="Password" '+
        'autocomplete="current-password" aria-label="Password" required>'+
      '<button type="submit" id="go">Enter</button>'+
    '</form>'+
    '<div class="gate-err" id="ge">'+(msg?esc(msg):'')+'</div>'+
    '<div class="gate-foot">Private manuscript \u00b7 not for distribution</div></div>';
  var form=document.getElementById('gf'), pw=document.getElementById('pw'),
      go=document.getElementById('go'), err=document.getElementById('ge');
  pw.focus();
  form.onsubmit=function(e){
    e.preventDefault();
    if(go.disabled)return;
    go.disabled=true;go.textContent='Checking\u2026';err.textContent='';
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pw.value})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
      .then(function(o){
        if(o.ok){boot();return}
        go.disabled=false;go.textContent='Enter';pw.value='';pw.focus();
        err.textContent=(o.j&&o.j.error)||'Incorrect password';
      })
      .catch(function(){go.disabled=false;go.textContent='Enter';
        err.textContent='Could not reach the server. Try again.';});
  };
}

/* ── Boot ────────────────────────────────────────────────────────────────── */
function boot(){
  app.innerHTML='<div class="loading">Opening the manuscript\u2026</div>';
  fetch('/api/manifest',{credentials:'same-origin'})
    .then(function(r){
      if(r.status===401){viewGate('');return null}
      if(!r.ok)throw new Error('manifest '+r.status);
      return r.json();
    })
    .then(function(d){
      if(!d)return;
      PARTS=d.parts;
      render();
    })
    .catch(function(){
      app.innerHTML='<div class="loading">Could not load the manuscript. Refresh to try again.</div>';
    });
}

window.addEventListener('hashchange',function(){if(PARTS.length)render()});
boot();
})();
</script>
